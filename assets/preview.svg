<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Ubuntu Mono', monospace; font-size: 13.5px; }
      .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .bold { font-weight: 600; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="878" height="228" rx="10" fill="#1a1a2e" stroke="#1e3a5f" stroke-width="2" />

  <!-- Titlebar -->
  <path d="M 1,11 A 10,10 0 0,1 11,1 L 869,1 A 10,10 0 0,1 879,11 L 879,38 L 1,38 Z" fill="#16213e" />
  <circle cx="24" cy="19" r="6" fill="#e53e3e" />
  <circle cx="44" cy="19" r="6" fill="#ecc94b" />
  <circle cx="64" cy="19" r="6" fill="#38a169" />
  <text x="440" y="24" text-anchor="middle" fill="#8A92B2" class="ui" font-size="13" font-weight="500">🦇 batman-powerline — zsh</text>

  <!-- Prompt Line (Y: 65 to 97, Height: 32) -->
  <g transform="translate(25, 62)">
    <!-- Segment 2 Background (Directory: Batman's Cape #0f3460) -->
    <rect x="110" y="0" width="240" height="32" fill="#0f3460" />

    <!-- Segment 3 Background (Git: Bat-Signal Yellow #ecc94b) -->
    <rect x="350" y="0" width="125" height="32" fill="#ecc94b" />

    <!-- Segment 4 Background (Runtime: Robin Emerald #2f855a) -->
    <rect x="475" y="0" width="135" height="32" fill="#2f855a" />

    <!-- Segment 5 Background (Time: Gotham Midnight #16213e) -->
    <rect x="610" y="0" width="105" height="32" fill="#16213e" />

    <!-- Segment 1: User / Start Cap (Joker Purple #805ad5) -->
    <path d="M 16,0 A 16,16 0 0,0 16,32 L 110,32 L 110,0 Z" fill="#805ad5" />
    <polygon points="110,0 124,16 110,32" fill="#805ad5" />
    <text x="26" y="21" fill="#e2e8f0" class="mono bold">jpwhite</text>

    <!-- Segment 2: Directory Text & Arrow -->
    <polygon points="350,0 364,16 350,32" fill="#0f3460" />
    <text x="136" y="21" fill="#e2e8f0" class="mono bold">…/batman-tas-theme</text>

    <!-- Segment 3: Git Text & Arrow -->
    <polygon points="475,0 489,16 475,32" fill="#ecc94b" />
    <!-- Git branch icon (SVG path) -->
    <g transform="translate(372, 8)" fill="#1a1a2e">
      <path d="M10 3a2 2 0 1 0-3 1.73V7a2 2 0 0 1-2 2H4.73A2 2 0 1 0 4.73 11H5a4 4 0 0 0 4-4V4.73A2 2 0 0 0 10 3zM3 10a1 1 0 1 1 1 1 1 1 0 0 1-1-1zm6-7a1 1 0 1 1-1 1 1 1 0 0 1 1-1z" />
    </g>
    <text x="392" y="21" fill="#1a1a2e" class="mono bold">main</text>

    <!-- Segment 4: Language Runtime (Node.js) & Arrow -->
    <polygon points="610,0 624,16 610,32" fill="#2f855a" />
    <!-- Node.js hexagonal icon -->
    <g transform="translate(497, 8)" fill="#e2e8f0">
      <path d="M8 1 L14 4.5 L14 11.5 L8 15 L2 11.5 L2 4.5 Z" stroke="#e2e8f0" stroke-width="1.2" fill="none" />
    </g>
    <text x="519" y="21" fill="#e2e8f0" class="mono bold">v26.13.1</text>

    <!-- Segment 5: Time & Final Arrow -->
    <polygon points="715,0 729,16 715,32" fill="#16213e" />
    <text x="630" y="21" fill="#cbd5e0" class="mono bold">♥ 14:35</text>

    <!-- Cursor -->
    <rect x="742" y="5" width="9" height="22" fill="#ecc94b" opacity="0.9" />
  </g>

  <!-- Terminal Session Output -->
  <g transform="translate(25, 130)">
    <text x="0" y="0" fill="#e2e8f0" class="mono">$ <tspan fill="#ecc94b">git</tspan> status</text>
    <text x="0" y="26" fill="#38a169" class="mono">On branch main - Your branch is up to date with 'origin/main'.</text>
    <text x="0" y="50" fill="#8A92B2" class="mono">nothing to commit, working tree clean</text>
  </g>
</svg>