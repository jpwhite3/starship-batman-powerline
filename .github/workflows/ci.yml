name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-starship-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Starship
        run: |
          curl -sS https://starship.rs/install.sh | sh -s -- -y

      - name: Validate Starship Config Syntax
        run: |
          TERM=xterm-256color STARSHIP_CONFIG=./starship.toml starship prompt
